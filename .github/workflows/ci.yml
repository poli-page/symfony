name: CI
on:
  # Branches only: a tag push runs this workflow through release.yml instead.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this whole workflow as the gate before the Packagist
  # publish, so a release can never be approved on a commit CI would reject.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        symfony: ['6.4.*', '7.*']
    steps:
      - uses: actions/checkout@v4
        with:
          path: symfony-bundle
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Global Symfony Flex is what reads extra.symfony.require (set by the
          # next step); without it the pin is ignored and every leg resolves 7.x.
          tools: flex
        env:
          fail-fast: true
      - name: Pin Symfony version
        working-directory: symfony-bundle
        run: composer config extra.symfony.require "${{ matrix.symfony }}"
      - name: Install
        working-directory: symfony-bundle
        run: composer update --prefer-dist --no-progress
      - name: Symfony version under test
        working-directory: symfony-bundle
        env:
          SYMFONY: ${{ matrix.symfony }}
        run: |
          # Fail when the pin did not take (e.g. Flex missing): the leg would
          # otherwise test the wrong Symfony and still pass.
          got=$(composer show symfony/framework-bundle | sed -n 's/^versions : \* v//p')
          echo "symfony/framework-bundle $got (matrix $SYMFONY)"
          case "$got" in
            "${SYMFONY%.\*}".*) ;;
            *) echo "::error::symfony/framework-bundle $got does not match $SYMFONY"; exit 1 ;;
          esac
      - name: Lint
        working-directory: symfony-bundle
        run: vendor/bin/php-cs-fixer check --diff
      - name: Static analysis
        working-directory: symfony-bundle
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Unit tests
        working-directory: symfony-bundle
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: vendor/bin/phpunit --testsuite=unit
      - name: Contract tests
        working-directory: symfony-bundle
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: vendor/bin/phpunit --testsuite=contract --testdox
      - name: Build the example app
        # The example app requires Symfony 7.
        if: matrix.symfony == '7.*'
        working-directory: symfony-bundle/example-app
        env:
          # debug:router builds the app; nothing is sent to the API.
          POLI_PAGE_API_KEY: pp_sandbox_0123456789abcdef0123456789abcdef
        run: |
          composer update --prefer-dist --no-progress
          bin/console debug:router error_not_found

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: symfony-bundle
      - uses: shivammathur/setup-php@v2
        if: steps.key.outputs.present == 'true'
        with:
          php-version: '8.3'
      - name: Install
        if: steps.key.outputs.present == 'true'
        working-directory: symfony-bundle
        run: |
          if [ -f composer.json ]; then
            composer update --prefer-dist --no-progress
          fi
      - name: Live API test (prod, sandbox key)
        if: steps.key.outputs.present == 'true'
        working-directory: symfony-bundle
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          if [ -d tests/Integration ] && [ -n "$(ls -A tests/Integration 2>/dev/null)" ]; then
            vendor/bin/phpunit --testsuite=integration
          else
            echo "Skipping integration tests: no tests/Integration yet"
          fi
